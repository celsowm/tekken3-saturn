name: Host combat regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable core
        run: cmake --preset host
      - name: Compile tests
        run: cmake --build --preset host
      - name: Run deterministic regressions
        run: ctest --preset host
      - name: Validate synthetic PS1 disc, ZIP, BNS table and stage converter
        run: python3 -m unittest discover -s tests -p 'test_psx_disc_import.py' -v
      - name: Validate DIVMOT compactor against synthetic raw and common move banks
        run: python3 -m unittest discover -s tests -p 'test_divmot_to_logic.py' -v
      - name: Validate PS1 104-entry sequence locator against synthetic USA-layout EXE
        run: python3 -m unittest discover -s tests -p 'test_extract_psx_sequences.py' -v
      - name: Validate private PS1 IK lookup exporter against synthetic EXE
        run: python3 -m unittest discover -s tests -p 'test_extract_psx_ik_tables.py' -v
  skeletal-asset-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: celsowm/libsaturn
          ref: 54379fd27f7baba087d223c4a822aea60fd0f863
          path: .external/libsaturn
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host generator requirements
        run: python -m pip install numpy pillow
      - name: Generate low-poly skeletal asset archive
        run: |
          python scripts/build_fighter_assets.py \
            --libsaturn-source .external/libsaturn \
            --output build/asset-fixture
      - name: Validate manifest and asset layout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("build/asset-fixture/manifest.json").read_text())
          assert data["format"] == "SKA1"
          assert data["joints"] == 24
          assert len(data["clips"]) == 9
          assert data["archive_bytes"] < 300000
          assert data["vertices"] > 50 and data["faces"] > 60
          print(data)
          PY
      - name: Verify KMD reader and compile synthetic KMD to real LibSaturn SKA1
        env:
          LIBSATURN_SOURCE_DIR: .external/libsaturn
        run: python3 -m unittest discover -s tests -p 'test_kmd_to_ska.py' -v
      - name: Compile-check private KMD alternate character ABI with synthetic fixture
        env:
          LIBSATURN_SOURCE_DIR: .external/libsaturn
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tests")
          import test_kmd_to_ska as fixture
          Path("build/asset-kmd").mkdir(parents=True,exist_ok=True)
          Path("build/asset-kmd/fixture.kmd").write_bytes(fixture.synthetic_kmd())
          PY
          python3 scripts/build_local_kmd_assets.py \
            --kmd build/asset-kmd/fixture.kmd \
            --libsaturn-source .external/libsaturn \
            --output build/asset-kmd/generated
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
            -I .external/libsaturn/include \
            -I src/game -I src/saturn -I build/asset-kmd/generated \
            src/saturn/main.c src/saturn/characters.c src/saturn/move_probe.c \
            build/asset-kmd/generated/t3_generated_character.c
      - name: Test private DIVMOT embed and optional Saturn probe on synthetic bank
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tests')
          import test_divmot_to_logic as t
          from divmot_to_logic import compact
          root=Path('build/asset-divmot')
          root.mkdir(parents=True,exist_ok=True)
          (root/'character.t3logic').write_bytes(compact(t.fake_bank(0))[0])
          (root/'common.t3logic').write_bytes(compact(t.fake_bank(99))[0])
          sys.path.insert(0, 'scripts')
          from extract_psx_sequences import extract
          import test_extract_psx_sequences as seq_fixture
          import json
          (root/'sequences.json').write_text(json.dumps(
              extract(seq_fixture.make_exe(),expected_sha=None)))
          PY
          python3 - <<'PY'
          from pathlib import Path
          Path("build/asset-divmot/spline.bin").write_bytes(bytes(0x660))
          Path("build/asset-divmot/trig.bin").write_bytes(bytes(0x2800))
          Path("build/asset-divmot/ik.bin").write_bytes(bytes(0x1F2))
          PY
          python3 scripts/build_local_divmot_assets.py \
              --bank build/asset-divmot/character.t3logic \
              --common build/asset-divmot/common.t3logic \
              --sequences build/asset-divmot/sequences.json \
              --spline-tables build/asset-divmot/spline.bin \
              --trig-table build/asset-divmot/trig.bin \
              --ik-tables build/asset-divmot/ik.bin \
              --output build/asset-divmot/generated
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
              -DT3_LOCAL_DIVMOT_ENABLED=1 \
              -I .external/libsaturn/include \
              -I src/game -I src/saturn -I build/asset-fixture \
              -I build/asset-divmot/generated \
              src/saturn/main.c src/saturn/move_probe.c \
              build/asset-divmot/generated/t3_local_divmot.c
          # Combined private KMD + DIVMOT path, with synthetic fixture only.
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
              -DT3_LOCAL_DIVMOT_ENABLED=1 \
              -I .external/libsaturn/include \
              -I src/game -I src/saturn \
              -I build/asset-kmd/generated -I build/asset-divmot/generated \
              src/saturn/move_probe.c
      - name: Compile-check all Saturn C frontend sources against public LibSaturn headers
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
            -I .external/libsaturn/include \
            -I src/game -I src/saturn -I build/asset-fixture \
            src/saturn/main.c src/saturn/characters.c \
            build/asset-fixture/t3_generated_character.c
