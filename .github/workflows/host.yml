name: Host combat regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # pinned Tekken3Remake research oracle
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: celsowm/libsaturn
          ref: 10f995605e80a3903b345d1de029837168475a87
          path: .external/libsaturn
          persist-credentials: false
      - name: Configure portable core
        run: cmake --preset host -DT3_SATURN_MATH_INCLUDE_DIR="$PWD/.external/libsaturn/include"
      - name: Compile tests
        run: cmake --build --preset host
      - name: Confirm independent pose reference is available
        run: |
          test -f third_party/Tekken3Remake/tools/research/pose.py
          cmake --build --preset host --target t3_pose_eval
      - name: Run deterministic regressions
        run: ctest --preset host
      - name: Validate synthetic PS1 disc, ZIP, BNS table and stage converter
        run: python3 -m unittest discover -s tests -p 'test_psx_disc_import.py' -v
      - name: Validate DIVMOT compactor against synthetic raw and common move banks
        run: python3 -m unittest discover -s tests -p 'test_divmot_to_logic.py' -v
      - name: Validate PS1 104-entry sequence locator against synthetic USA-layout EXE
        run: python3 -m unittest discover -s tests -p 'test_extract_psx_sequences.py' -v
      - name: Validate private PS1 IK lookup exporter against synthetic EXE
        run: python3 -m unittest discover -s tests -p 'test_extract_psx_ik_tables.py' -v
      - name: Validate big-endian Saturn gameplay diagnostics
        run: python3 -m unittest discover -s tests -p 'test_saturn_probe.py' -v
      - name: Validate per-CPU profile attribution and ELF boundaries
        run: python3 -m unittest discover -s tests -p 'test_saturn_profile.py' -v
      - name: Validate bounded Saturn stage timing rings
        run: python3 -m unittest discover -s tests -p 'test_saturn_stages.py' -v
      - name: Validate saved Saturn run reports and cadence comparisons
        run: python3 -m unittest discover -s tests -p 'test_report_saturn_runs.py' -v
      - name: Validate bounded retries of torn debugger publications
        run: python3 -m unittest discover -s tests -p 'test_saturn_combat_suite.py' -v
      - name: Validate private texture importer with synthetic ARC and TIM data
        run: python3 -m unittest discover -s tests -p 'test_psx_character_textures.py' -v
      - name: Analyze synthetic PS1 combat oracle event timeline
        run: python3 -m unittest discover -s tests -p 'test_analyze_psx_combat_oracle.py' -v
      - name: Validate independent USA PS1 RAM oracle snapshots
        run: python3 -m unittest discover -s tests -p 'test_psx_ram_oracle.py' -v
      - name: Validate instruction-phase capture nesting and RAM checkpoint
        run: python3 -m unittest discover -s tests -p 'test_analyze_psx_phases.py' -v
      - name: Validate original replay input source modes
        run: python3 -m unittest discover -s tests -p 'test_audit_psx_match_replay.py' -v
      - name: Validate one-seed Saturn reference fixtures and complete trace comparisons
        run: python3 -m unittest discover -s tests -p 'test_reference_replay.py' -v
      - name: Compile-check PCSX-Redux LuaJIT capture script
        run: |
          command -v luajit || (sudo apt-get update -qq && sudo apt-get install -y -qq luajit)
          luajit -b scripts/pcsx_redux_capture_usa.lua /tmp/t3-psx-capture.luac
          luajit -b scripts/pcsx_redux_phase_capture.lua /tmp/t3-psx-phases.luac
          luajit -b scripts/pcsx_redux_paul_session.lua /tmp/t3-psx-session.luac
      - name: Validate frame-by-frame PS1 combat oracle comparator
        run: python3 -m unittest discover -s tests -p 'test_compare_psx_combat_traces.py' -v
      - name: Validate PS1 pose trace binary/JSONL oracle comparator
        run: python3 -m unittest discover -s tests -p 'test_compare_psx_pose_traces.py' -v
  skeletal-asset-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: celsowm/libsaturn
          ref: 10f995605e80a3903b345d1de029837168475a87
          path: .external/libsaturn
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host generator requirements
        run: python -m pip install numpy pillow
      - name: Test frozen presentation comparator
        run: python -m unittest discover -s tests -p 'test_compare_saturn_presentation.py' -v
      - name: Generate low-poly skeletal asset archive
        run: |
          python scripts/build_fighter_assets.py \
            --libsaturn-source .external/libsaturn \
            --output build/asset-fixture
      - name: Validate manifest and asset layout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("build/asset-fixture/manifest.json").read_text())
          assert data["format"] == "SKA1"
          assert data["joints"] == 24
          assert len(data["clips"]) == 9
          assert data["archive_bytes"] < 300000
          assert data["vertices"] > 50 and data["faces"] > 60
          print(data)
          PY
      - name: Verify KMD reader and compile synthetic KMD to real LibSaturn SKA1
        env:
          LIBSATURN_SOURCE_DIR: .external/libsaturn
        run: python3 -m unittest discover -s tests -p 'test_kmd_to_ska.py' -v
      - name: Compile-check private KMD alternate character ABI with synthetic fixture
        env:
          LIBSATURN_SOURCE_DIR: .external/libsaturn
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tests")
          import test_kmd_to_ska as fixture
          Path("build/asset-kmd").mkdir(parents=True,exist_ok=True)
          Path("build/asset-kmd/fixture.kmd").write_bytes(fixture.synthetic_kmd())
          PY
          python3 scripts/build_local_kmd_assets.py \
            --kmd build/asset-kmd/fixture.kmd \
            --libsaturn-source .external/libsaturn \
            --output build/asset-kmd/generated
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
            -I .external/libsaturn/include \
            -I src/game -I src/saturn -I build/asset-kmd/generated \
            src/saturn/main.c src/saturn/characters.c src/saturn/move_probe.c \
            build/asset-kmd/generated/t3_generated_character.c
      - name: Test private DIVMOT embed and optional Saturn probe on synthetic bank
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tests')
          import test_divmot_to_logic as t
          from divmot_to_logic import compact
          root=Path('build/asset-divmot')
          root.mkdir(parents=True,exist_ok=True)
          (root/'character.t3logic').write_bytes(compact(t.fake_bank(0))[0])
          (root/'common.t3logic').write_bytes(compact(t.fake_bank(99))[0])
          sys.path.insert(0, 'scripts')
          from extract_psx_sequences import extract
          import test_extract_psx_sequences as seq_fixture
          import json
          (root/'sequences.json').write_text(json.dumps(
              extract(seq_fixture.make_exe(),expected_sha=None)))
          PY
          python3 - <<'PY'
          from pathlib import Path
          Path("build/asset-divmot/spline.bin").write_bytes(bytes(0x660))
          Path("build/asset-divmot/trig.bin").write_bytes(bytes(0x2800))
          Path("build/asset-divmot/ik.bin").write_bytes(bytes(0x1F2))
          Path("build/asset-divmot/ground.bin").write_bytes(bytes(1025+0x58C))
          Path("build/asset-divmot/body.bin").write_bytes(bytes(432))
          PY
          python3 scripts/build_local_divmot_assets.py \
              --bank build/asset-divmot/character.t3logic \
              --common build/asset-divmot/common.t3logic \
              --sequences build/asset-divmot/sequences.json \
              --spline-tables build/asset-divmot/spline.bin \
              --trig-table build/asset-divmot/trig.bin \
              --ik-tables build/asset-divmot/ik.bin \
              --ground-tables build/asset-divmot/ground.bin \
              --body-tables build/asset-divmot/body.bin \
              --output build/asset-divmot/generated
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
              -I src/game -I build/asset-divmot/generated \
              tools/psx_move_decision_eval.c
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
              -DT3_LOCAL_DIVMOT_ENABLED=1 \
              -I .external/libsaturn/include \
              -I src/game -I src/saturn -I build/asset-fixture \
              -I build/asset-divmot/generated \
              src/saturn/main.c src/saturn/move_probe.c \
              build/asset-divmot/generated/t3_local_divmot.c
          # Test actual PS1 pose-to-LibSaturn 16.16 skin bridge.
          gcc -std=c11 -Wall -Wextra -Werror \
              -I .external/libsaturn/include \
              -I src/game -I src/saturn \
              src/saturn/psx_skin_bridge.c tests/test_psx_skin_bridge.c \
              -o build/asset-divmot/test_psx_skin_bridge
          build/asset-divmot/test_psx_skin_bridge
          # Combined private KMD + DIVMOT path, with synthetic fixture only.
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
              -DT3_LOCAL_DIVMOT_ENABLED=1 \
              -I .external/libsaturn/include \
              -I src/game -I src/saturn \
              -I build/asset-kmd/generated -I build/asset-divmot/generated \
              src/saturn/move_probe.c src/saturn/psx_skin_bridge.c \
              src/saturn/characters.c
          # Real renderer opt-in must compile with all private includes.
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
              -DT3_LOCAL_DIVMOT_ENABLED=1 \
              -DT3_ENABLE_PSX_SKIN_PREVIEW=1 \
              -I .external/libsaturn/include \
              -I src/game -I src/saturn \
              -I build/asset-kmd/generated -I build/asset-divmot/generated \
              src/saturn/characters.c src/saturn/move_probe.c \
              src/saturn/psx_skin_bridge.c
          # Owned movement must compile without provisional runtime dependencies.
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
              -DT3_LOCAL_DIVMOT_ENABLED=1 \
              -DT3_ENABLE_PSX_SKIN_PREVIEW=1 \
              -DT3_ENABLE_PSX_MOVE_LIFECYCLE=1 \
              -DT3_ENABLE_PSX_OWNED_MATCH=1 \
              -I .external/libsaturn/include \
              -I src/game -I src/saturn \
              -I build/asset-kmd/generated -I build/asset-divmot/generated \
              src/saturn/main.c src/saturn/move_probe.c src/saturn/characters.c
          # Combat mode's types and frontend wiring compile with synthetic
          # includes; full retail reaction data is never required in CI.
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
              -DT3_LOCAL_DIVMOT_ENABLED=1 \
              -DT3_ENABLE_PSX_SKIN_PREVIEW=1 \
              -DT3_ENABLE_PSX_MOVE_LIFECYCLE=1 \
              -DT3_ENABLE_PSX_OWNED_MATCH=1 -DT3_ENABLE_PSX_COMBAT=1 \
              -I .external/libsaturn/include -I src/game -I src/saturn \
              -I build/asset-kmd/generated -I build/asset-divmot/generated \
              src/saturn/main.c src/saturn/move_probe.c src/saturn/characters.c
          # Both SH-2 preparation and its serial verifier compile without retail data.
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
              -DT3_LOCAL_DIVMOT_ENABLED=1 -DT3_ENABLE_PSX_SKIN_PREVIEW=1 \
              -DT3_ENABLE_PSX_OWNED_MATCH=1 -DT3_ENABLE_PSX_COMBAT=1 \
              -DT3_PARALLEL_GEOMETRY=1 -DT3_VERIFY_PARALLEL_GEOMETRY=1 \
              -I .external/libsaturn/include -I src/game -I src/saturn \
              -I build/asset-kmd/generated -I build/asset-divmot/generated \
              src/saturn/main.c src/saturn/move_probe.c src/saturn/characters.c
          # Shadow combat is read-only and requires externally injected roots.
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
              -DT3_LOCAL_DIVMOT_ENABLED=1 \
              -DT3_ENABLE_PSX_SHADOW_CONTACT=1 \
              -I .external/libsaturn/include \
              -I src/game -I src/saturn \
              -I build/asset-kmd/generated -I build/asset-divmot/generated \
              src/saturn/main.c src/saturn/move_probe.c \
              src/game/psx_shadow_combat.c
      - name: Compile-check instrumented Saturn reference path using only synthetic data
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path[:0]=['tests','scripts']
          from test_reference_replay import synthetic_export
          from build_reference_replay import generate
          root=Path('build/reference-synthetic')
          root.mkdir(parents=True,exist_ok=True)
          synthetic_export(root,[100,101,101,105])
          generate(root,root/'t3_reference_fixture.h')
          PY
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
              -DT3_LOCAL_DIVMOT_ENABLED=1 -DT3_ENABLE_PSX_SKIN_PREVIEW=1 \
              -DT3_ENABLE_PSX_MOVE_LIFECYCLE=1 -DT3_ENABLE_PSX_OWNED_MATCH=1 \
              -DT3_ENABLE_PSX_COMBAT=1 -DT3_REFERENCE_REPLAY=1 \
              -I .external/libsaturn/include -I src/game -I src/saturn -I tools \
              -I build/asset-kmd/generated -I build/asset-divmot/generated \
              -I build/reference-synthetic src/saturn/main.c src/saturn/move_probe.c
      - name: Compile-check optional simulation profiling against public SDK headers
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only -DT3_SIM_PROFILE=1 \
            -I .external/libsaturn/include -I src/game \
            src/game/*.c src/saturn/sim_profile.c
      - name: Compile-check all Saturn C frontend sources against public LibSaturn headers
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
            -I .external/libsaturn/include \
            -I src/game -I src/saturn -I build/asset-fixture \
            src/saturn/main.c src/saturn/characters.c \
            src/saturn/move_probe.c src/saturn/psx_skin_bridge.c \
            build/asset-fixture/t3_generated_character.c
