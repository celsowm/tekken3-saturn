name: Saturn SDK
# The game ELF and disc need the private PS1 data, which never enters
# GitHub Actions; build them locally. This job builds the pinned LibSaturn.
on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/saturn.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/saturn.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libsaturn-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout pinned LibSaturn
        uses: actions/checkout@v4
        with:
          repository: celsowm/libsaturn
          ref: a198f9274b24a903ff19bafa36263febce4a06da
          path: .external/libsaturn
          persist-credentials: false

      - name: Install cross-toolchain and disc prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential texinfo bison flex wget xz-utils \
              ninja-build xorriso python3
          python3 -m pip install --user --break-system-packages numpy pillow

      - name: Restore cached SH-2 GCC 13.2 toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/saturn-tools
          key: tekken3-saturn-sh2eb-elf-${{ runner.os }}-${{ hashFiles('.external/libsaturn/scripts/build-toolchain.sh') }}

      - name: Build SH-2 toolchain from LibSaturn (cache miss only)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        working-directory: .external/libsaturn
        env:
          PREFIX: ${{ runner.temp }}/saturn-tools
          ROOT: ${{ runner.temp }}/saturn-toolchain-src
        run: JOBS=3 bash scripts/build-toolchain.sh

      - name: Expose verified cross compiler
        run: |
          echo "$RUNNER_TEMP/saturn-tools/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/saturn-tools/bin/sh2eb-elf-gcc" --version
          "$RUNNER_TEMP/saturn-tools/bin/sh2eb-elf-g++" --version

      - name: Configure and install the public LibSaturn package
        run: |
          cmake -S .external/libsaturn -B build/libsaturn -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.external/libsaturn/cmake/toolchains/sh2eb-elf.cmake" \
              -DCMAKE_BUILD_TYPE=Release -DLIBSATURN_BUILD_TESTS=OFF
          cmake --build build/libsaturn --parallel 3
          cmake --install build/libsaturn --prefix "$GITHUB_WORKSPACE/build/libsaturn-install"
